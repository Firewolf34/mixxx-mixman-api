name: soundtouch
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DSOUNDSTRETCH=OFF
sources:
  - type: git
    url: https://codeberg.org/soundtouch/soundtouch.git
    tag: 2.4.0
    commit: d994965fbbcf0f6ceeed0e72516968130c2912f0
    x-checker-data:
      type: git
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/soundtouch COPYING.TXT
