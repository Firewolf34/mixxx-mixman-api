# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: GitHub Deck Candidate Flatpak

on:
  push:
    branches:
      - github/candidate

permissions:
  contents: read

jobs:
  flatpak-x86_64:
    name: Build and validate x86_64 deck Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
      volumes:
        - /usr:/host/usr
        - /opt:/host/opt

    steps:
      - name: Recover host disk space
        run: |
          rm -rf /host/opt/hostedtoolcache/CodeQL
          rm -rf /host/opt/hostedtoolcache/go
          rm -rf /host/usr/local/lib/android
          rm -rf /host/usr/local/.ghcup
          rm -rf /host/usr/local/share/powershell
          rm -rf /host/usr/share/swift
          rm -rf /host/usr/share/dotnet

      - name: Check out the exact candidate
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify candidate and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          test "${GITHUB_REF}" = refs/heads/github/candidate
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          tools/check_deck_flatpak_manifest.sh

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/org.mixxx.Mixxx.deck.yaml
          arch: x86_64
          build-bundle: false
          upload-artifact: false

      - name: Create and validate Flatpak bundle
        shell: bash
        run: |
          set -euo pipefail
          flatpak build-bundle repo \
            --arch=x86_64 \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            Mixxx.flatpak \
            org.mixxx.Mixxx
          test -s Mixxx.flatpak

          validation_repo="$(mktemp -d)"
          trap 'rm -rf -- "${validation_repo}"' EXIT
          ostree init --repo="${validation_repo}" --mode=archive-z2
          flatpak build-import-bundle "${validation_repo}" Mixxx.flatpak
          ostree --repo="${validation_repo}" fsck
          ostree --repo="${validation_repo}" refs | \
            grep -Fxq app/org.mixxx.Mixxx/x86_64/master

          flatpak_commit="$(ostree --repo="${validation_repo}" rev-parse \
            app/org.mixxx.Mixxx/x86_64/master)"
          source tools/deck_ostree_validation.sh
          deck_ostree_commit_subject_contains_source \
            "${validation_repo}" "${flatpak_commit}" "${GITHUB_SHA}"

          timeout 30 flatpak build \
            --env=QT_QPA_PLATFORM=offscreen \
            build_flatpak \
            /app/bin/mixxx --version

          bundle_sha256="$(sha256sum Mixxx.flatpak | awk '{print $1}')"
          bundle_size="$(stat -c '%s' Mixxx.flatpak)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > github-candidate-manifest.json <<EOF
          {
            "schema_version": 1,
            "provider": "github-actions",
            "channel": "github-candidate",
            "app_id": "org.mixxx.Mixxx",
            "arch": "x86_64",
            "source_sha": "${GITHUB_SHA}",
            "source_ref": "${GITHUB_REF}",
            "built_at": "${built_at}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "bundle_filename": "Mixxx.flatpak",
            "sha256": "${bundle_sha256}",
            "size_bytes": ${bundle_size}
          }
          EOF

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v7.0.0
        with:
          name: Mixxx-flatpak-x86_64
          path: |
            Mixxx.flatpak
            github-candidate-manifest.json
          compression-level: 0
          retention-days: 3
