# yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Deck Flatpak Build

on:
  push:
    branches:
      - deck/candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak-x86_64:
    name: Build and publish x86_64 deck Flatpak
    runs-on: mixxx-flatpak-x86_64
    timeout-minutes: 1440
    env:
      CCACHE_DIR: /data/ccache
      CCACHE_MAXSIZE: 512M
      CCACHE_COMPRESS: "true"
      XDG_CACHE_HOME: /data/cache
      TMPDIR: /data/tmp
      MIXXX_DECK_PUBLISH_ROOT: /srv/mixxx-deck
      MIXXX_DECK_PUBLIC_BASE_URL: https://forge.polinaria.world/mixxx-deck
      MIXXX_DECK_KEEP_BUILDS: "2"
      MIXXX_DECK_SOURCE_REF: ${{ forgejo.ref }}
      MIXXX_DECK_EVENT_SHA: ${{ forgejo.sha }}
      FLATPAK_BUILDER_JOBS: "1"

    steps:
      - name: Check out the exact source commit
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Check low-memory VPS build headroom
        run: |
          tools/check_deck_flatpak_manifest.sh
          tools/deck_build_preflight.sh

      - name: Ensure the Flatpak SDK is available
        run: tools/deck_pressure_guard.sh tools/flatpak_buildenv.sh setup --user

      - name: Build, validate, and publish
        run: tools/deck_pressure_guard.sh tools/deck_flatpak_publish.sh

      - name: Remove transient build data
        if: always()
        run: |
          ccache --cleanup || true
          rm -rf -- build_flatpak flatpak_repo Mixxx.flatpak .flatpak-builder
